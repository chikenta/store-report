name: Keep Supabase Alive

on:
  schedule:
    # 毎週月曜日 午前9時（日本時間）に実行
    - cron: "0 0 * * 1"
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/stores?select=name&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "Supabase ping complete"
